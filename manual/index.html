<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<title>คู่มือพนักงาน</title>
<style>
:root{--tea:#5B2A19;--milk:#F3E6D3;--pearl:#2B1A10;--matcha:#5E7D3A;--paper:#FFFBF5;--line:#E4D3BC;--soft:#7A5A42}
*{box-sizing:border-box}
body{margin:0;background:var(--milk);color:var(--pearl);font-family:"Sarabun",system-ui,sans-serif;font-size:17px;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
h1,h2,h3{font-family:"Mitr",sans-serif;font-weight:500;color:var(--tea);line-height:1.25}
h1{font-size:24px;margin:4px 0 4px}
a.back{display:inline-block;margin:2px 0 10px;color:var(--tea);font:500 16px "Mitr",sans-serif;text-decoration:none}
.upd{color:var(--soft);font-size:14px;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 16px 8px;margin:0 0 10px}
.card h3{margin:0 0 4px;font-size:19px;display:flex;gap:8px;align-items:center}
a{color:inherit}
.card ul{margin:0;padding-left:20px} .card li{margin:2px 0} b{color:var(--tea)}
.pill{display:inline-block;min-width:34px;text-align:center;border-radius:8px;padding:0 6px;font-weight:700;color:#241A14}
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 8px}
.pt div{border:1px solid var(--line);border-radius:10px;text-align:center;padding:4px 0;font-size:14px;line-height:1.35}
.pt b{display:block;font-size:16px} .pt span{color:var(--soft)}
@media (max-width:420px){.pt{grid-template-columns:repeat(3,1fr)}}
.note{background:#FFF4D6;border:1px solid #E9CF83;border-radius:14px;padding:10px 14px;font-size:15px;margin:0 0 14px}
.btn{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--tea);border-radius:16px;padding:12px 16px;margin:0 0 10px;color:inherit;text-decoration:none;min-height:66px}
.btn.full{border-left-color:var(--matcha)}
.btn .i{font-size:26px;flex:0 0 36px;text-align:center}
.btn .t{font:500 18px "Mitr",sans-serif;display:block} .btn .d{font-size:14px;color:var(--soft);display:block}
/* เนื้อหาคู่มือฉบับเต็ม (แปลงจาก Word) */
.doc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;overflow-wrap:anywhere}
.doc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15.5px}
.doc td,.doc th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.doc th{background:var(--milk)}
.doc col{width:auto!important}
.doc blockquote{margin:4px 0 8px;padding:0 0 0 10px;border-left:3px solid var(--line)}
.doc p{margin:4px 0}
.doc img{max-width:100%;height:auto}
.scroll{overflow-x:auto}
</style></head><body><main>
<h1>📘 คู่มือพนักงาน ชาคุมะ</h1><p class=upd>อัปเดต 19 ต.ค. 69</p>
<p class=upd>เลือกสาขาของตัวเอง</p>
<a class=btn href="borsang.html"><span class=i>🏠</span><span><span class=t>สาขาบ่อสร้าง</span><span class=d>เริ่มงาน 8:30 น. · อาทิตย์ 9:00 น.</span></span></a><a class=btn href="santhrai.html"><span class=i>📮</span><span><span class=t>สาขาสันทราย</span><span class=d>เริ่มงาน 8:30 น. · อาทิตย์ 9:00 น.</span></span></a><a class=btn href="fahham.html"><span class=i>🌤️</span><span><span class=t>สาขาฟ้าฮ่าม</span><span class=d>เริ่มงาน 8:00 น. · อาทิตย์ 9:00 น.</span></span></a><a class=btn href="saraphi.html"><span class=i>🌸</span><span><span class=t>สาขาสารภี</span><span class=d>เริ่มงาน 8:30 น. · อาทิตย์ 9:00 น.</span></span></a>
</main></body></html>
